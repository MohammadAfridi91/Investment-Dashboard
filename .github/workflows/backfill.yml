name: Historical Backfill

on:
  workflow_dispatch:
    inputs:
      sessions:
        description: 'Trading sessions to backfill'
        required: false
        type: number
        default: 375
      start_date:
        description: 'Start date (YYYY-MM-DD). Blank = auto.'
        required: false
        type: string

concurrency:
  group: backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BACKFILL_SESSIONS: ${{ inputs.sessions }}
          BACKFILL_START_DATE: ${{ inputs.start_date }}
        run: python scripts/backfill.py
