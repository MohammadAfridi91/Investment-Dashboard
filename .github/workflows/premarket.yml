name: Pre-Market Refresh

on:
  schedule:
    - cron: '15 3 * * 1-5'
  workflow_dispatch:

concurrency:
  group: premarket-refresh
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run pre-market refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python run_daily_pipeline.py --mode premarket
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premarket-logs-${{ github.run_id }}
          path: |
            logs/
            data/errors/
          retention-days: 30
          if-no-files-found: ignore

