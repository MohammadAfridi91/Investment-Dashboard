name: EOD Pipeline

on:
  schedule:
    - cron: '15 13 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target date (YYYY-MM-DD). Blank = today.'
        required: false
        type: string
      skip_ingestion:
        description: 'Skip ingestion, only run engines'
        required: false
        type: boolean
        default: false

concurrency:
  group: eod-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-eod:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run EOD pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          ARGS="--mode eod"
          if [ -n "${{ inputs.target_date }}" ]; then
            ARGS="$ARGS --date ${{ inputs.target_date }}"
          fi
          if [ "${{ inputs.skip_ingestion }}" = "true" ]; then
            ARGS="$ARGS --skip-ingestion"
          fi
          python run_daily_pipeline.py $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eod-logs-${{ github.run_id }}
          path: |
            logs/
            data/errors/
          retention-days: 30
          if-no-files-found: ignore
